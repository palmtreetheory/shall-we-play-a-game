<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#010b04">
  <title>W.O.P.R. // ACCESS TERMINAL</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color:#a2faa2; background:#010905;
      font-family: 'VT323', 'Lucida Console', 'Courier New', monospace;
      display:grid; place-items:center; padding:24px; }
    body::after { content:""; position:fixed; inset:0; pointer-events:none; opacity:.35;
      background:repeating-linear-gradient(to bottom, transparent 0,transparent 3px, #000a 4px,transparent 5px); }
    main { position:relative; width:min(100%,780px); border:2px solid #41954c; padding:clamp(20px,5vw,54px);
      background:#020f07; box-shadow: 0 0 55px #36ff4921, inset 0 0 55px #082613; }
    .top { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; border-bottom:1px dashed #356b3b;
      padding-bottom:18px; margin-bottom:35px; font: 11px 'Silkscreen','Courier New',monospace; }
    h1 { margin:0 0 22px; font: 400 clamp(50px,9vw,92px)/.89 'VT323',monospace; letter-spacing:.01em;
      text-shadow:0 0 20px #5fdb6366; }
    .lead { font-size:clamp(25px,3.9vw,33px); line-height:1.17; margin:0 0 15px; }
    .secondary { font-size:22px; color:#70a779; margin:0 0 30px; }
    button { border:1px solid #8aff8c; background:#83fa87; color:#021306;
      font: 11px 'Silkscreen',monospace; padding:18px 20px; cursor:pointer; border-radius:0; }
    button:hover,button:focus-visible { background:#c8ffbc; outline:2px solid #fff; outline-offset:3px; }
    .base { border-top:1px dashed #356b3b; padding-top:20px; margin-top:35px; color:#70a779; font-size:19px; }
  </style>
</head>
<body>
  <main>
    <div class="top"><span>W.O.P.R. // JOSHUA</span><span>CONNECTION ESTABLISHED_</span></div>
    <h1>GREETINGS,<br>PROFESSOR FALKEN.</h1>
    <p class="lead">SHALL WE PLAY A GAME? <span aria-hidden="true">█</span></p>
    <p class="secondary">SIMULATED NETWORK ACCESS · EST. 1983</p>
    <button type="button" onclick="window.WarGamesWidget?.open()">&gt; INITIALIZE TERMINAL</button>
    <div class="base">SYSTEM READY // SELECT INITIALIZE TO BEGIN</div>
  </main>
  <script src="./wargames-widget.js" data-auto-open="false" data-accent="green"></script>
</body>
</html>
